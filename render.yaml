# Free-tier deployment selected by the user.
# No persistent disk: reports can disappear on restart or redeploy.
services:
  - type: web
    name: gbp-audit-by-amrendar
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    numInstances: 1
    autoDeployTrigger: checksPass
    envVars:
      - key: AUDIT_DATA_DIR
        value: /data/audits
      - key: AUDIT_ALLOWED_ORIGINS
        value: https://askamrendar.github.io
      - key: AUDIT_RETENTION_HOURS
        value: '24'
      - key: AUDIT_MAX_STORES
        value: '1'
      - key: AUDIT_STORAGE_EPHEMERAL
        value: 'true'
